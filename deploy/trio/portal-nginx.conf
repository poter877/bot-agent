# 门户壳反代：/ → 静态壳；/drama/ → ai-drama 前端；/hermes/ → dashboard。
# 同源挂载让两个子前端的 cookie 不跨域（统一认证的前提）。
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # ai-drama 前端（vite 构建产物由 bot-backend 容器托管在同卷——这里直连容器）
    location /drama/ {
        proxy_pass http://bot-backend:30172/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # hermes dashboard
    location /hermes/ {
        proxy_pass http://hermes-gateway:9119/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
