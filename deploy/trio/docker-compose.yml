# 联调编排：bot-backend（含视频工厂 drama 子应用）+ hermes gateway
#
# 用法（在有 Docker 的机器上，从本目录执行）：
#   cp ../../ai-drama/.env.example .env   # 或按下述变量自行填写
#   docker compose up -d --build          # 起基础设施 + bot-backend + ai-drama
#   docker compose --profile hermes up -d --build   # 连 hermes gateway 一起起（首次构建较重）
#   ./smoke.sh                            # 联调冒烟
#
# 说明：hermes-gateway 用仓库根 Dockerfile 构建（含公司模式代码），默认放在
# `hermes` profile 里——基础设施栈不依赖它也能起来。drama profile 的
# HERMES_HOME 挂在命名卷上，首次启动后把 config.yaml 放进去（模板见
# ../../ai-drama/docs/hermes-integration.md）再重启该服务。

name: hermes-trio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes}
      POSTGRES_DB: bot_backend
    volumes:
      - trio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d bot_backend"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - trio-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  bot-backend:
    build:
      context: ../../bot-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BOT_BACKEND_HOST_PORT:-30172}:30172"
    volumes:
      - trio-drama-media:/data/drama-media
      - ../../ai-drama/frontend-react/dist:/app/frontend-dist:ro
      - ../../bot-backend/workspace:/app/workspace:ro
      - ../../bot-backend/film-core:/app/film-core:ro
    environment:
      DATABASE_URL: postgres://hermes:${POSTGRES_PASSWORD:-hermes}@postgres:5432/bot_backend
      REDIS_URL: redis://redis:6379/0
      # 浏览器同源基准：本机访问用 http://localhost:30172；服务间调用走
      # INTERNAL_SERVICE_TOKEN，不受同源约束。
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:30172}
      # 内网互访 origin 信任名单
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://bot-backend:30172}
      # 视频工厂子应用：本地作业（ffmpeg/sharp）与媒体落盘
      AI_DRAMA_DATA_ROOT: /data/drama-media
      AI_DRAMA_MCP_TOKEN: ${AI_DRAMA_MCP_TOKEN:?set a token for hermes<->ai-drama}
      # 公司模型网关与编排（drama 运行时）
      COMPANY_BACKEND_URL: http://bot-backend:30172
      COMPANY_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?}
      HERMES_AGENT_URL: http://hermes-gateway:30175
      HERMES_AGENT_KEY: ${API_SERVER_KEY:-}
      # 视频工厂前端静态托管（宿主构建 dist 挂载进容器）
      FRONTEND_DIST: /app/frontend-dist
      WORKSPACE_PATH: /app/workspace
      FILM_CORE_PATH: /app/film-core
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a 32+ char secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set a 24+ char token}
      BOT_BACKEND_ADMIN_EMAILS: ${BOT_BACKEND_ADMIN_EMAILS:-}
      # 厂商密钥按需透传（目录里有条目才需要对应密钥）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      KLING_ACCESS_KEY: ${KLING_ACCESS_KEY:-}
      KLING_SECRET_KEY: ${KLING_SECRET_KEY:-}
      # 并发标定：drama 账号承载全部 agent turn，默认 2 会成为任务并发瓶颈。
      # 见 ../../ai-drama/docs/hermes-integration.md §并发标定。
      LLM_STREAM_MAX_CONCURRENT_PER_USER: ${LLM_STREAM_MAX_CONCURRENT_PER_USER:-8}
      RATE_LIMIT_LLM_STREAM_MAX: ${RATE_LIMIT_LLM_STREAM_MAX:-240}
      RATE_LIMIT_LLM_STREAM_WINDOW_SECONDS: ${RATE_LIMIT_LLM_STREAM_WINDOW_SECONDS:-60}


  hermes-gateway:
    profiles: ["hermes"]
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      - bot-backend
    ports:
      - "${GATEWAY_HOST_PORT:-30175}:30175"
    environment:
      HERMES_HOME: /data/drama-home
      API_SERVER_KEY: ${API_SERVER_KEY:?}
      # 容器内默认绑 127.0.0.1，端口映射会连不通；对外服务必须绑全网卡。
      API_SERVER_HOST: 0.0.0.0
      HERMES_BOT_BACKEND_URL: http://bot-backend:30172
    command: ["hermes", "gateway"]
    volumes:
      - trio-drama-home:/data/drama-home

volumes:
  trio-drama-media:
  trio-postgres:
  trio-redis:
  trio-drama-home:
